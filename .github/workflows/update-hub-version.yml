name: Update hub version

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'

jobs:
  update-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Extract version from docs/index.html
        id: ver
        run: |
          VERSION=$(grep -oP '(?<=id="appVer">v)[0-9]+\.[0-9]+\.[0-9]+' docs/index.html)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Checkout hub repo
        uses: actions/checkout@v4
        with:
          repository: azzabazza11/azzabazza11.github.io
          token: ${{ secrets.HUB_TOKEN }}
          path: hub

      - name: Update Back Me Up version in apps/index.html
        run: |
          sed -i "/id: 'audio-backup-helper'/,/^}/s/version: '[0-9]*\.[0-9]*\.[0-9]*'/version: '${{ steps.ver.outputs.version }}'/" hub/apps/index.html

      - name: Commit and push to hub
        run: |
          cd hub
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/index.html
          git diff --cached --quiet || git commit -m "chore: bump back-me-up to v${{ steps.ver.outputs.version }}"
          git push
